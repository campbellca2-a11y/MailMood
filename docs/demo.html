<!DOCTYPE html><html><head><title>MailMood Demo</title><style>body{font-family:sans-serif;max-width:800px;margin:50px auto;padding:20px}textarea{width:100%;height:100px;font-size:16px}button{padding:10px 20px;font-size:16px}.result{margin-top:20px;padding:20px;background:#f0f0f0;border-radius:8px}.badge{display:inline-block;padding:8px 16px;border-radius:20px;color:white;font-weight:bold}</style></head><body><h1>Try MailMood Live</h1><textarea id="input" placeholder="Paste email text here..."></textarea><button onclick="analyze()">Analyze</button><div id="result" class="result" style="display:none"><div class="badge" id="badge"></div><p id="explain"></p></div><script>function analyze(){const t=document.getElementById('input').value.toLowerCase();let mood='neutral';const c=document.getElementById('result');if(t.includes('great')||t.includes('awesome'))mood='Warm';else if(t.includes('urgent')||t.includes('asap'))mood='Urgent';else if(t.includes('sorry')||t.includes('mistake'))mood='Anxious';const b=document.getElementById('badge');b.textContent=mood;b.style.background=mood==='Warm'?'#ff6b00':mood==='Urgent'?'#c62828':'#607d8b';document.getElementById('explain').textContent='Detected: '+mood;c.style.display='block'}</script></body></html>
